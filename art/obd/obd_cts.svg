  <path d="M0,380 L100,392 L78,660 L0,660 Z" fill="url(#sill)"/>
  <path d="M0,380 L100,392 L96,410 L0,400 Z" fill="#000" opacity=".4"/>

  
    <path d="M631,338 L649,338 L648,476 L632,476 Z" fill="url(#metal)" mask="url(#armFade)"/>
