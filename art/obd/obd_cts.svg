    </g>
    <line x1="838.0" y1="452.0" x2="882.0" y2="452.0" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="838.0" y1="481.2" x2="882.0" y2="481.2" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="838.0" y1="510.4" x2="882.0" y2="510.4" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="838.0" y1="539.6" x2="882.0" y2="539.6" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="838.0" y1="568.8" x2="882.0" y2="568.8" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/><line x1="838.0" y1="598.0" x2="882.0" y2="598.0" stroke="#0b0c0e" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <rect x="828.0" y="440" width="64" height="170" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="2"/>
  <path d="M100,290 Q560,340 1080,252 L1080,412 Q560,480 100,420 Z" fill="url(#underDash)"/>

